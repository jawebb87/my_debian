# ==============================================================================
# Kitty Terminal Configuration - Gruvbox Dark
# ==============================================================================

# --- Typography ---
font_family      DejaVu Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Padding ---
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# --- Bell & Audio ---
enable_audio_bell no
visual_bell_duration 0.0

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 10000
mouse_hide_wait 3.0
detect_urls yes
url_color #83a598

# ==============================================================================
# Gruvbox Dark Color Palette
# ==============================================================================
# Core colors
background              #282828
foreground              #ebdbb2
selection_foreground    #ebdbb2
selection_background    #665c54

cursor                  #ebdbb2
cursor_text_color       #282828

# Normal colors (Dark / Neutral tones)
color0                  #3c3836
color1                  #cc241d
color2                  #98971a
color3                  #d79921
color4                  #458588
color5                  #b16286
color6                  #689d6a
color7                  #a89984

# Bright colors (Vibrant / Highlight tones)
color8                  #928374
color9                  #fb4934
color10                 #b8bb26
color11                 #fabd2f
color12                 #83a598
color13                 #d3869b
color14                 #8ec07c
color15                 #fbf1c7
