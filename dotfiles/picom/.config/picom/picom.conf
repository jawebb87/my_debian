# ==============================================================================
# Picom Compositor Configuration (Lightweight & Tear-Free)
# ==============================================================================

# --- Backend & Performance ---
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
vsync = true;
use-damage = true;

# --- Subtle Shadows ---
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.4;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Dunst'",
  "class_g = 'qtile'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Smooth Fading ---
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 10;
no-fading-openclose = false;

# --- Window Type Settings ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
